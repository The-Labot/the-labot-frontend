name: react ci

on:
  pull_request:
    branches:
      - main
  #GHA 캐시는 기본 브랜치에서 저장된 것만 모든 브랜치가 읽는다. 이 실행이 캐시를 채운다 (#51)
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./react #경로설정

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react/package-lock.json #캐싱 경로 설정

      - name: Install dependencies
        run: npm ci

      - name: Build React
        run: npm run build
